name: Bug report
description: Report a confirmed or suspected defect.
title: "[Bug]: "
labels: ["bug"]
body:
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: What is wrong?
    validations:
      required: true
  - type: input
    id: route
    attributes:
      label: Route
      placeholder: /produtos/fieldops
  - type: input
    id: environment
    attributes:
      label: Environment
      placeholder: local, preview, production
  - type: input
    id: browser
    attributes:
      label: Browser or Playwright project
      placeholder: Chrome, web-mobile-chromium
  - type: input
    id: viewport
    attributes:
      label: Viewport
      placeholder: 390x844
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction
      description: Steps to reproduce.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Evidence
      description: Screenshots, logs, traces or test output.
  - type: dropdown
    id: severity
    attributes:
      label: Severity
      options:
        - blocks release
        - major user impact
        - minor user impact
        - internal cleanup
    validations:
      required: true
